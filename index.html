<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>A&amp;R Instinct</title>
<script>if(!/[?&]look=old/.test(location.search))document.documentElement.classList.add('rr')</script>
<style>
:root{
  --bg:#bfbfbf; --ink:#000; --dark:#000; --mute:rgba(0,0,0,.55); --line:rgba(0,0,0,.18); --hover:rgba(255,255,255,.35);
  --lime:#d7ff5c; --lemon:#fff38a; --pink:#ffb3d9; --sky:#a8d8ff;
  --sans:-apple-system,system-ui,Inter,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font:500 10.5px/1.35 var(--sans);text-transform:uppercase;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input{font:inherit;color:inherit;background:none;border:0;text-transform:inherit}
button{cursor:pointer}
::selection{background:var(--lime);color:var(--dark)}

.top{display:flex;align-items:flex-start;gap:22px;padding:16px 22px 0;flex-wrap:wrap}
.logo{cursor:pointer;border:0;text-align:left;background:#000;color:#fff;display:inline-flex;align-items:center;padding:8px 14px 9px;font-weight:800;font-size:20px;line-height:1;letter-spacing:-.02em;text-transform:none;flex:none}
.kp{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px;align-items:flex-start}
.pill{display:inline-block;font-weight:800;font-size:13px;line-height:1;letter-spacing:.03em;padding:8px 13px 9px;border-radius:99px;background:var(--c);color:#000;text-transform:uppercase}
.pill:hover{box-shadow:0 0 0 1px #000}
.pill.on{box-shadow:0 0 0 2px #000}
.k1{--c:var(--lime)}.k2{--c:var(--lemon)}.k3{--c:var(--pink)}.k4{--c:var(--sky)}.k5{--c:#fff}
.top .sp{flex:1}
.meta{color:var(--mute);text-align:right;padding-top:4px}
.tg{display:inline-block;font-size:8px;font-weight:800;padding:0 4px 1px;border-radius:2px;margin-left:6px;vertical-align:1px;border:1px solid #000;color:#000;background:none;opacity:.55}
.tg.mp{background:#000;color:var(--bg)}
.tg:hover,.tg.on{opacity:1}


.layout{display:grid;grid-template-columns:1fr;gap:0;margin-top:14px;align-items:start}

aside{display:none;position:sticky;top:0;max-height:100vh;overflow:auto;padding:0 14px 40px 22px;scrollbar-width:thin}
aside h4{font-weight:500;font-size:10px;color:var(--mute);margin:18px 0 6px;display:flex;justify-content:space-between}
aside h4 button{color:var(--mute)}
.f{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:3px 0;border-radius:4px;line-height:1.2}
.f .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;padding:0}
.f .c{color:var(--mute);font-variant-numeric:tabular-nums;font-size:11px}
.f .o{opacity:0;color:var(--mute);padding:0 2px;width:14px}
.f:hover .o,.f:focus-within .o{opacity:1}
.f:hover{background:var(--hover)}
.f.on .l{color:var(--dark);background:var(--lemon);padding:0 5px;border-radius:3px;flex:0 1 auto}
.f.on.pk .l{background:var(--pink)}.f.on.sk .l{background:var(--sky)}
.f.on .c{margin-right:auto}
.bk{display:flex;gap:2px;align-items:flex-end;height:44px;margin-bottom:4px}
.bk button{flex:1;background:#000;opacity:.28;min-height:2px}
.bk button:hover{opacity:.85}.bk button.on{opacity:1;background:var(--lime)}
.bkl{display:flex;gap:2px;color:var(--mute);font-size:10px}
.bkl span{flex:1;text-align:center}
.scroll{max-height:240px;overflow:auto;scrollbar-width:thin}

main{min-width:0;padding:0 22px}
.layout.fx{grid-template-columns:250px 1fr}
.layout.fx aside{display:block}
.layout.fx main{padding-left:0}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tabs button{padding:3px 8px;border-radius:99px;text-decoration:underline;text-underline-offset:2px;opacity:.6}
.tabs button:hover{opacity:1}
.tabs button.on{background:var(--lime);text-decoration:none;opacity:1}
.tabs button .n{color:var(--mute);margin-left:5px;font-size:11px}
.tabs button.on .n{color:rgba(0,0,0,.6)}
.q{flex:1;min-width:140px;border-bottom:1px solid #000;padding:4px 2px;outline:0;margin-left:8px}
.q::placeholder{color:var(--mute)}
.act{padding:3px 8px;border-radius:99px;text-decoration:underline;text-underline-offset:2px}
.act:hover{background:var(--hover)}
.active{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.active:empty{display:none}
.active button{background:var(--lemon);color:var(--dark);padding:2px 5px 2px 8px;border-radius:99px}
.active button::after{content:" ×";opacity:.55}
.active .clr{background:none;color:var(--ink);text-decoration:underline;padding:2px 6px}
.active .clr::after{content:""}

.head,.row{display:grid;grid-template-columns:80px minmax(110px,.9fr) minmax(130px,1.2fr) 158px 158px minmax(120px,1fr) minmax(150px,1.6fr);gap:0 12px;align-items:start}
@media (min-width:901px){.nosong .head,.nosong .row{grid-template-columns:80px minmax(110px,.9fr) 158px 158px minmax(120px,1fr) minmax(150px,1.6fr)}}
.nosong .head [data-sort=song],.nosong .row>.s{display:none}
.head{position:sticky;top:0;z-index:3;background:var(--bg);border-bottom:1px solid #000;padding:7px 8px 6px;font-size:10px;color:var(--mute)}
.head button{text-align:left;color:inherit;padding:0}
.head button.s{color:var(--ink)}
.head button.s::after{content:" ↓"}
.head button.s.asc::after{content:" ↑"}
.head .r{text-align:left}
.row{padding:6px 8px;border-bottom:1px solid var(--line);min-height:34px}
.row:hover,.row.sel{background:var(--hover)}
.row.fg{background:rgba(255,226,102,.30)}
.row.fg:hover{background:rgba(255,226,102,.45)}
.row.sel{box-shadow:inset 3px 0 0 #000}
.row .d{color:var(--mute);font-variant-numeric:tabular-nums;text-align:left;padding:0;font-size:10px}
.row .d:hover{color:var(--ink);text-decoration:underline}
.row .a{font-weight:700;text-align:left;padding:0;overflow-wrap:anywhere}
.row .a:hover{text-decoration:underline}
.row .s a{overflow-wrap:anywhere}
.row .s a:hover{text-decoration:underline}
.num{position:relative;display:block;text-align:left;font-variant-numeric:tabular-nums;color:#000;height:22px;line-height:16px;padding:0}
.num::before{content:"";position:absolute;left:0;bottom:0;height:4px;width:var(--w);min-width:3px;background:var(--c);border-radius:2px}
.num span{position:relative}
a.num:hover span{text-decoration:underline}
.n1{--c:#1DB954}.n2{--c:#E1306C}
.row .none{color:var(--mute);text-align:left;display:block}
.GR{display:flex;align-items:center;gap:6px;height:22px;font-variant-numeric:tabular-nums}
.GR svg{flex:none;overflow:visible}
.GR .gp{font-weight:700;display:inline-block;min-width:38px;white-space:nowrap}
.GR .up{color:#0b6b2f}.GR .dn{color:#b3261e}
.GR .none{display:block}
.NG{display:flex;align-items:center;gap:8px}
.NG .num{width:66px;flex:none}
.fl{padding:0 5px 0 0;font-size:12px;line-height:1;opacity:.45;vertical-align:-1px}
.fl:hover{opacity:1}.fl.on{opacity:1}.fl.lock{cursor:default}
.rp{font-size:9px;font-weight:800;padding:0 5px 1px;margin-left:4px;border-radius:2px;background:var(--lemon);color:#000;vertical-align:1px}
.rp:hover{background:#000;color:var(--bg)}
#hist{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px 16px;overflow:auto}
#hist[hidden]{display:none}
.jp{font-size:9px;font-weight:800;padding:0 5px 1px;border-radius:2px;background:#d9342b;color:#fff;white-space:nowrap}
.nb{font-size:10px;margin-left:5px;opacity:0;vertical-align:1px}
.row:hover .nb,.nb.has{opacity:.6}.nb:hover{opacity:1!important}
.nt{font-size:10px;color:var(--mute);margin-top:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nt b{color:#000}
#hist .hf{margin:6px 0 4px}
#hist .igf{display:flex;gap:8px;align-items:baseline;margin:10px 0 4px;flex-wrap:wrap}
#hist .igf input{background:none;border:0;border-bottom:1px solid #000;padding:3px 0;font:inherit;color:#000;min-width:0}
#hist .igf .igi{width:150px}#hist .igf .igc{width:120px}
#hist .igf button{font-weight:800;font-size:11px;padding:3px 12px 4px;border-radius:99px;background:var(--lime);color:#000}
.iga{font-size:9px;letter-spacing:.06em;color:rgba(0,0,0,.42);border:1px solid rgba(0,0,0,.2);border-radius:2px;padding:2px 8px 3px;background:rgba(0,0,0,.025)}
.row:hover .iga,.iga:hover{color:#000;border-color:#000;background:none}
.igp{font-size:10px;opacity:0;margin-left:4px}.row:hover .igp{opacity:.6}.igp:hover{opacity:1!important}
#hist .fb{font-weight:800;font-size:11px;padding:3px 10px 4px;border-radius:99px;background:var(--pink);color:#000}
#hist .fb.on{background:#000;color:var(--bg)}
#hist .ns{margin:10px 0 4px}
#hist .nr{padding:6px 0;border-top:1px solid rgba(0,0,0,.2)}
#hist .nr .nx{opacity:.4;font-size:10px;margin-left:4px}#hist .nr .nx:hover{opacity:1}
#hist .nf{display:flex;gap:6px;margin-top:8px}
#hist .nf input{background:none;border:0;border-bottom:1px solid #000;padding:3px 0;font:inherit;color:#000;min-width:0}
#hist .nf .ni{width:96px}
#hist .nf .nx2{flex:1}
#hist .nf button{font-weight:800;font-size:11px;padding:3px 12px 4px;border-radius:99px;background:var(--lime);color:#000}
#hist .hc{position:relative;background:var(--bg);border:1px solid #000;width:100%;max-width:620px;padding:20px 22px 8px}
#hist h3{font-size:15px;font-weight:800;text-transform:uppercase;letter-spacing:.02em;margin-right:30px}
#hist .hs{color:var(--mute);font-size:10px;margin:4px 0 12px}
#hist .hx{position:absolute;top:12px;right:14px;font-size:14px}
#hist .hr{display:grid;grid-template-columns:70px 1fr;gap:0 12px;padding:10px 0;border-top:1px solid #000}
#hist .hd{font-size:10px;color:var(--mute);padding-top:2px}
#hist .hm>a{font-weight:700}#hist .hm>a:hover{text-decoration:underline}
#hist .hn{display:block;color:var(--mute);font-size:10px;margin:2px 0 6px}
.chip i{font-style:normal;opacity:.6;margin-left:6px;font-size:9px}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{display:inline-block;color:var(--dark);padding:1px 7px 2px;border-radius:99px;font-size:10px;line-height:1.35;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.chip:hover{box-shadow:0 0 0 1px var(--dark)}
.chip.pr{background:var(--pink)}
.chip.pl{background:var(--lemon)}
.chip.sp{background:#fff}
.chip.sh{background:var(--lime)}
a.chip::after{content:" ↗";opacity:.45}
.shw{display:inline-block;margin-top:4px;background:var(--lime);padding:0 8px 1px;border-radius:99px;font-size:10px;font-weight:700}
.shw:hover{box-shadow:0 0 0 1px #000}
.shwl{display:flex;flex-direction:column;gap:2px;margin-top:5px;align-items:flex-start}
.shwl span b{display:block;font-weight:400;opacity:.65}
.shwl span{background:var(--lime);padding:1px 8px 2px;border-radius:3px;font-size:10px}
.daycap{display:flex;gap:10px;align-items:baseline;padding:16px 8px 5px;border-bottom:1px solid #000;font-size:11px}
.daycap button{font-weight:700;padding:0}
.daycap button:hover{text-decoration:underline}
.daycap span{color:var(--mute)}
.daycap a{margin-left:auto;background:var(--lime);color:#000;padding:0 8px 1px;border-radius:99px;font-weight:700}
.empty{padding:50px 8px;color:var(--mute)}
footer{margin:50px 22px 0;padding:8px 0 20px;border-top:1px solid #000;color:var(--mute);font-size:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
kbd{font:inherit;border:1px solid rgba(0,0,0,.4);border-radius:3px;padding:0 4px;margin:0 1px}

@media (max-width:900px){
  .layout.fx aside{position:fixed;inset:0;z-index:10;background:var(--bg);max-height:none;padding:18px 22px 80px}
  .layout.fx{grid-template-columns:1fr}
  main{padding:0 14px}
  .top{gap:14px;padding:16px 14px 0}.kp{gap:14px}.meta{align-items:flex-start;text-align:left;width:100%}
  .head{display:none}
  .row{grid-template-columns:1fr auto;grid-template-areas:"a l" "s g" "p p" "pl pl";gap:1px 10px}
  .row .d{display:none}
  .row .A{grid-area:a}.row .s{grid-area:s}
  .row .L{grid-area:l;width:104px}.row .G{grid-area:g;width:104px}
  .NG svg{display:none}.NG .num{width:50px}
  .row .P{grid-area:p;margin-top:4px}.row .PL{grid-area:pl;margin-top:3px}
  .row .P:empty,.row .PL:empty{display:none}
  .row .PL{display:none}
}
#gate,#who{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
#gate[hidden],#who[hidden]{display:none}
#gate .logo,#who .logo{width:auto;height:auto;font-size:26px;padding:10px 18px 11px}
#who p{color:var(--mute);font-size:10px;text-align:center}
#who input{font:inherit;font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;text-align:center;border-bottom:1px solid #000;width:240px;padding:6px 0;outline:0;background:none;color:#000;border-radius:0}
#who .row2{display:flex;gap:14px;align-items:center}
#who button[type=submit]{font-weight:800;font-size:12px;padding:6px 16px 7px;border-radius:99px;background:var(--lime);color:#000}
#who #whox{text-decoration:underline}
.me{font-weight:800;font-size:10px;padding:2px 8px 3px;border:1px solid #000;border-radius:99px;margin-right:12px;vertical-align:1px}
.me:hover{background:#000;color:var(--bg)}
#gate input{font:inherit;font-size:13px;text-transform:uppercase;letter-spacing:.12em;text-align:center;border-bottom:1px solid #000;width:240px;padding:6px 0;outline:0;background:none;color:#000;border-radius:0}
#gate input::placeholder{color:var(--mute)}
#gate .err{height:12px;color:#000;font-size:10px}

/* R&R is the default; ?look=old restores the grey/pastel look. pure R&R: white, black only, one heavy block, tiny uppercase type, everything else underlined text */
html.rr,html.rr body{--bg:#fff;--mute:rgba(0,0,0,.5);--line:rgba(0,0,0,.1);--hover:rgba(0,0,0,.035);background:#fff}
.rr .pill{background:none;padding:0 0 1px;border-radius:0;font-size:10.5px;font-weight:500;letter-spacing:.04em;text-decoration:underline;text-underline-offset:2px;box-shadow:none!important}
.rr .pill.on{font-weight:800}
.rr .kp{gap:22px;padding-top:6px}
.rr .tabs{gap:18px;margin-top:6px}
.rr .tabs button{padding:0;border-radius:0;opacity:.55}.rr .tabs button.on{background:none;font-weight:800;opacity:1;text-decoration:underline}
.rr .act{padding:0;border-radius:0}.rr .act:hover{background:none;font-weight:800}
.rr .active button{background:none;padding:0;border-radius:0;text-decoration:underline}
.rr .chip{padding:1px 6px 2px;border-radius:2px;text-decoration:none;font-size:10px}
.rr .chip.pr{background:#ffd6ea}
.rr .chip.pl,.rr .chip.sp{background:#fff4a3}
.rr .chip.sh{background:#e9ffa8}
.rr .chip:hover{box-shadow:0 0 0 1px #000}
.rr .chips{gap:3px;align-items:flex-start;align-content:flex-start}
.rr .shw{background:none;padding:0;border-radius:0;text-decoration:underline;font-weight:500}
.rr .shwl span{background:none;padding:0;border-radius:0}
.rr .daycap a{background:none;padding:0;border-radius:0;text-decoration:underline;font-weight:500}
.rr .daycap{border-bottom:1px solid #000}
.rr .num::before{background:#000;height:2px}
.rr .jp{background:#000;border-radius:0}
.rr .rp{background:none;border:1px solid #000;border-radius:0;color:#000}
.rr .tg,.rr .tg.mp{border-radius:0}
.rr .head{border-bottom:1px solid #000}
.rr .row{border-bottom:1px solid var(--line)}
@media (min-width:901px){
.rr .head,.rr .row{align-items:stretch;column-gap:0;grid-template-columns:80px minmax(110px,.9fr) minmax(130px,1.2fr) 186px 186px minmax(120px,1fr) minmax(150px,1.6fr)}
.rr .nosong .head,.rr .nosong .row{grid-template-columns:80px minmax(110px,.9fr) 186px 186px minmax(120px,1fr) minmax(150px,1.6fr)}
.rr .head>*,.rr .row>*{padding-left:12px;padding-right:6px}
.rr .head>*+*,.rr .row>*+*{border-left:1px solid rgba(0,0,0,.06)}
.rr .head>*:first-child,.rr .row>*:first-child{padding-left:0}
.rr .head button{padding-left:12px}.rr .head button:first-child{padding-left:0}
}
.rr .logo{border-radius:0}
.rr #q{border-bottom:1px solid #000}
</style>
</head>
<body>
<form id="gate" autocomplete="off">
  <div class="logo" aria-hidden="true">A&amp;R Instinct</div>
  <input id="pw" type="password" placeholder="password" autofocus autocomplete="current-password" spellcheck="false">
  <div class="err" id="err"></div>
</form>
<div class="top">
  <button class="logo" data-act="home" title="everything (SP + MP combined)" aria-label="Show everything">A&amp;R Instinct</button>
  <div class="kp">
    <button class="pill k3" data-act="flagged">Flagged</button>
        <a class="pill k4" href="playlists.html">Playlists</a>
  </div>
  <span class="sp"></span>
  <div class="meta"><button class="me" id="me" data-act="me" title="your name - click to change"></button><span id="upd"></span></div>
</div>

<div class="layout">
<aside id="aside">
  <h4>listeners <button data-act="clr-bk">clear</button></h4>
  <div class="bk" id="bk"></div><div class="bkl" id="bkl"></div>
  <h4>found on <span style="font-size:10px">label filters · ↗ opens</span></h4>
  <div class="scroll" id="f-pl" style="max-height:300px"></div>
  <h4>press outlets</h4>
  <div class="scroll" id="f-pr"></div>
  <h4>superplaylists</h4>
  <div class="scroll" id="f-sp"></div>
  <button class="act" data-act="facets" style="margin-top:18px">done</button>
</aside>

<main>
  <div class="tabs" id="tabs"></div>
  <div class="tabs">
    <button class="act" data-act="facets">filters</button>
    <input class="q" id="q" type="search" placeholder="search artist, song, outlet, playlist  ( / )" autocomplete="off" spellcheck="false">
    <button class="act" data-sort="gr">sort: listener growth</button><button class="act" data-sort="iggr">sort: instagram growth</button><button class="act" data-act="csv">csv</button>
  </div>
  <div class="active" id="active"></div>
  <div class="head" id="head">
    <button data-sort="date">date</button><button data-sort="artist">artist</button><button data-sort="song">song</button>
    <button class="r" data-sort="listeners">monthly listeners</button><button class="r" data-sort="ig">instagram</button>
    <button data-sort="press">press</button><button data-sort="pls">playlists</button>
  </div>
  <div id="rows"></div>
  <div id="hist" hidden></div>
  <div id="who" hidden><div class="logo">A&amp;R Instinct</div><p>enter your name for flags / notes</p><form id="whof" autocomplete="off"><div class="row2"><input id="whoi" maxlength="24" placeholder="your name" aria-label="name"><button type="submit">enter</button><button type="button" id="whox" hidden>cancel</button></div></form></div>
  <div class="empty" id="empty" hidden>nothing matches. <button class="act" data-act="clear">clear filters</button></div>
</main>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null?'':n>=1e6?(n/1e6).toFixed(1)+'m':n>=1e4?Math.round(n/1e3)+'k':n>=1e3?(n/1e3).toFixed(1)+'k':String(n);
const dstr=iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'});
const dlong=iso=>new Date(iso+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
const BK=[[0,1e3,'<1k'],[1e3,5e3,'1–5k'],[5e3,1e4,'5–10k'],[1e4,25e3,'10–25k'],[25e3,5e4,'25–50k'],[5e4,1e9,'50k+']];
const isSP=n=>/^superplaylist #/i.test(n);
const spN=n=>+(n.match(/#(\d+)/)||[0,0])[1];

let LF=new Set();try{LF=new Set(JSON.parse(localStorage.getItem('instinct_flags')||'[]'))}catch(e){}
const akey=s=>s.artist.split(/,| & | feat\.? | x /i)[0].trim().toLowerCase();
let API=null,TEAM={},INI='';try{INI=localStorage.getItem('instinct_ini')||''}catch(e){}
const tm=k=>TEAM[k]||(TEAM[k]={flag:null,notes:[]});

function spark(h,W=44){

    else if(i>0){const a=pts[i-1],c=pts[i],f=(T0-a[0])/(c[0]-a[0]);pts=[[T0,a[1]+(c[1]-a[1])*f],...pts.slice(i)]}}

}
let REP={},CAPS={},OPEN=new Set(),SPL=[],ALL=[],DAYS=[],S={view:'all',q:'',days:new Set(),pls:new Set(),pr:new Set(),sp:new Set(),bk:new Set(),sort:'date',dir:-1,sel:-1,src:'',flag:false},VIEW=[],lastDay=null;

const KEY={iggr:s=>{const g=gr(s,'igh');return g&&g.pct!=null?g.pct:-9},gr:s=>{const g=gr(s);return g&&g.pct!=null?g.pct:-9},date:s=>s.date,artist:s=>s.artist.toLowerCase(),song:s=>s.song.toLowerCase(),listeners:s=>s.listeners??-1,ig:s=>s.ig??-1,press:s=>(s.press||[]).length,pls:s=>(s.playlists||[]).length};

}
const paintMe=()=>{const b=$('#me');if(b)b.textContent=INI?INI+' ▾':'set your name'};
function askIni(first){const w=$('#who');$('#whoi').value=INI;$('#whox').hidden=!!first&&!INI;w.hidden=false;setTimeout(()=>$('#whoi').focus(),30)}
$('#whof').addEventListener('submit',e=>{e.preventDefault();const v=$('#whoi').value.trim().slice(0,24);if(!v){$('#whoi').focus();return}INI=v;try{localStorage.setItem('instinct_ini',v)}catch(er){}$('#who').hidden=true;paintMe()});
$('#whox').addEventListener('click',()=>{$('#who').hidden=true});
function needIni(k){if(INI)return false;openHist(k);const i=document.querySelector('#hist .ni');i&&i.focus();return true}
const toggle=(set,v)=>set.has(v)?set.delete(v):set.add(v);

document.addEventListener('click',e=>{
  if(HO&&e.target.id==='hist'){closeHist();return}
  if(e.target.closest('a[href]:not([href="#"])'))return;
  const b=e.target.closest('[data-act],[data-sort]');
  if(!b)return;
  if(b.dataset.sort){const k=b.dataset.sort;if(S.sort===k)S.dir*=-1;else{S.sort=k;S.dir=k==='artist'||k==='song'?1:-1}render();return}
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='hist'){openHist(v);return}
  if(a==='histx'){closeHist();return}
  if(a==='me'){askIni(false);return}
  if(a==='igadd'){if(needIni(v))return;openHist(v);setTimeout(()=>{const f=document.querySelector('#hist .igi');f&&f.focus()},40);return}
  if(a==='pflag'){if(needIni(v))return;const o=TEAM[v];teamAct({type:o&&o.flag?'unflag':'flag',a:v,n:nameOf(v),i:INI});return}
  if(a==='ndel'){if(PO&&confirm('Delete this note?'))teamAct({type:'del',a:PO,n:nameOf(PO),x:v});return}
  if(a==='view')S.view=v;
  else if(a==='day'||a==='strip'){
    if(e.shiftKey&&lastDay&&a==='strip'){const i=DAYS.indexOf(lastDay),j=DAYS.indexOf(v);DAYS.slice(Math.min(i,j),Math.max(i,j)+1).forEach(d=>S.days.add(d))}
    else{if(a==='day')S.days=new Set(S.days.has(v)&&S.days.size===1?[]:[v]);else toggle(S.days,v);lastDay=v}
  }
  else if(a==='artist'){S.q=v;$('#q').value=v}
  else if(a==='f')toggle({'f-pl':S.pls,'f-pr':S.pr,'f-sp':S.sp}[b.dataset.k],v);
  else if(a==='bk')toggle(S.bk,+v);
  else if(a==='clr-bk')S.bk.clear();
  else if(a==='rm'){const k=b.dataset.k;({days:S.days,pls:S.pls,pr:S.pr,sp:S.sp,bk:S.bk})[k].delete(k==='bk'?+v:v)}
  else if(a==='clear')clearAll();
  else if(a==='home'){clearAll();S.sort='date';S.dir=-1;S.sel=-1;window.scrollTo(0,0)}
  else if(a==='flag'&&API){if(b.classList.contains('lock'))return;if(needIni(v))return;const o=TEAM[v],was=!!(o&&o.flag);teamAct({type:was?'unflag':'flag',a:v,n:nameOf(v),i:INI});if(!was){openHist(v);setTimeout(()=>{const f=document.querySelector('#hist .nx2');f&&f.focus()},40)}return}
  else if(a==='flag'){if(b.classList.contains('lock'))return;LF.has(v)?LF.delete(v):LF.add(v);try{localStorage.setItem('instinct_flags',JSON.stringify([...LF]))}catch(e){}}
  else if(a==='shows'){OPEN.has(v)?OPEN.delete(v):OPEN.add(v);renderRows();return}
  else if(a==='csv'){csv();return}
  else if(a==='facets'){document.querySelector('.layout').classList.toggle('fx');return}
  else if(a==='src')S.src=S.src===v?'':v;
  else if(a==='flagged')S.flag=!S.flag;
  render();
});
const parseCount=s=>{s=String(s||'').trim().toLowerCase().replace(/,/g,'');const m=s.match(/^([\d.]+)\s*([km])?$/);if(!m)return null;const n=parseFloat(m[1])*(m[2]==='k'?1e3:m[2]==='m'?1e6:1);return isFinite(n)&&n>0?Math.round(n):null};
document.addEventListener('submit',e=>{const g=e.target.closest('.igf');if(g){e.preventDefault();
  const h=igHandle(g.u.value.trim().replace(/^@/,'')),c=parseCount(g.c.value);
  if(!/^[A-Za-z0-9._]{1,30}$/.test(h)){g.u.focus();g.u.style.borderBottomColor='#d9342b';return}
  teamAct({type:'ig',a:g.dataset.v,n:nameOf(g.dataset.v),i:INI,x:'https://www.instagram.com/'+h+'/|'+(c||'')});return}const f=e.target.closest('.nf');if(!f)return;e.preventDefault();
  const i=f.i.value.trim().slice(0,24),x=f.x.value.trim();if(!i||!x){(i?f.x:f.i).focus();return}
  INI=i;try{localStorage.setItem('instinct_ini',i)}catch(er){}f.x.value='';teamAct({type:'note',a:f.dataset.v,n:nameOf(f.dataset.v),i,x})});
$('#q').addEventListener('input',e=>{S.q=e.target.value;render()});
document.addEventListener('keydown',e=>{
  const t=e.target.tagName==='INPUT';
  if(e.key==='Escape'&&!$('#who').hidden&&INI){$('#who').hidden=true;return}
  if(e.key==='Escape'&&HO){closeHist();return}
  if(e.key==='Escape'){if(t)e.target.blur();clearAll();S.sel=-1;render();return}
  if(t||e.metaKey||e.ctrlKey)return;
  if(e.key==='/'){e.preventDefault();$('#q').focus();return}
  if(e.key==='j'||e.key==='k'){S.sel=Math.max(0,Math.min(VIEW.length-1,S.sel+(e.key==='j'?1:-1)));renderRows();const el=document.querySelector('.row.sel');el&&el.scrollIntoView({block:'center'});return}
  if(e.key==='Enter'&&S.sel>=0&&VIEW[S.sel]&&VIEW[S.sel].track)window.open(VIEW[S.sel].track,'_blank','noopener');
});
function csv(){
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[['date','artist','song','monthly listeners','instagram','press','playlists','agency','agent','track url'],...VIEW.map(s=>[s.date,s.artist,s.song,s.listeners,s.ig,(s.press||[]).map(p=>p.t).join(' | '),(s.playlists||[]).map(p=>p.t).join(' | '),s.ag||'',s.agt||'',s.track])];
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download='instinct.csv';a.click();
}

function init(data){
  {const tk={};data.songs.forEach(s=>{if(s.track)tk[s.track]=akey(s)});let ch=false;
   [...LF].forEach(k=>{if(/^https?:/.test(k)){LF.delete(k);if(tk[k])LF.add(tk[k]);ch=true}else if(k.includes('|')){LF.delete(k);LF.add(k.split('|')[0].split(/,| & | feat\.? | x /i)[0].trim().toLowerCase());ch=true}});
   if(ch)try{localStorage.setItem('instinct_flags',JSON.stringify([...LF]))}catch(e){}}
  {const c=new Date();c.setMonth(c.getMonth()-6);const cut=c.toISOString().slice(0,10);data.songs.forEach(s=>{if(s.press)s.press=s.press.filter(p=>!p.d||p.d>=cut)})}
  REP={};data.songs.forEach(s=>{const k=akey(s);REP[k]=(REP[k]||0)+1});
  TW=null;ALL=data.songs.slice().sort((a,b)=>(a.src==='MP')-(b.src==='MP'));
  DAYS=[...new Set(ALL.map(s=>s.date))].sort();
  const u=new Date(data.updated);
  $('#upd').textContent='updated '+u.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' '+u.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  render();
}
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function decrypt(enc,pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(enc.s),iterations:enc.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(enc.v)},key,b64(enc.c));
  return JSON.parse(new TextDecoder().decode(pt));
}
const getEnc=()=>fetch('data.enc.json?'+Date.now()).then(r=>r.json());
let PW=null;
async function unlock(pw){
  const d=await decrypt(await getEnc(),pw);
  PW=pw;window.__u=d.updated;SPL=d.spl||[];CAPS=d.caps||{};API=d.api||null;
  $('#gate').hidden=true;init(d);pullTeam();paintMe();if(API&&!INI)askIni(true);
  try{localStorage.setItem('instinct_pw',pw)}catch(e){}
}
$('#gate').addEventListener('submit',async e=>{
  e.preventDefault();$('#err').textContent='';
  try{await unlock($('#pw').value)}catch(x){$('#err').textContent='wrong password';$('#pw').select()}
});
(async()=>{
  load();
  let pw=null;try{pw=localStorage.getItem('instinct_pw')}catch(e){}
  if(pw){try{await unlock(pw)}catch(e){try{localStorage.removeItem('instinct_pw')}catch(_){}}}
  if(!PW)$('#pw').focus();
})();
setInterval(pullTeam,45e3);
setInterval(async()=>{if(!PW)return;try{const d=await decrypt(await getEnc(),PW);if(d.updated!==window.__u){window.__u=d.updated;SPL=d.spl||[];CAPS=d.caps||{};API=d.api||null;init(d);pullTeam()}}catch(e){}},9e5);
</script>
