<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>A&amp;R Instinct</title>
<script>if(!/[?&]look=old/.test(location.search))document.documentElement.classList.add('rr')</script>
<script>document.write('<link rel="stylesheet" href="styles.css?'+Date.now()+'">')</script><noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
<form id="gate" autocomplete="off">
  <div class="logo" aria-hidden="true">A&amp;R Instinct</div>
  <input id="pw" type="password" aria-label="password" autofocus autocomplete="current-password" spellcheck="false">
  <div class="err" id="err" role="status" aria-live="polite"></div>
</form>
<div id="stale" role="alert" hidden></div>
<div id="alerts" hidden></div>
<header class="top"><h1 class="sr">A&amp;R Instinct</h1>
  <div class="kp">
    <div class="kg"><button class="pill k3 hs" data-act="flagged" aria-pressed="false" title="only flagged artists">Flagged</button><button class="pill k5 hs" data-act="hs" aria-pressed="false" title="hide artists that already have an agency on ROSTR">hide signed artists</button></div>
    <div class="kg"><button class="pill tm" data-act="feed" hidden title="what the team has done">activity<span id="fb"></span></button><button class="pill" data-act="digest" title="this week at a glance">this week</button><button class="pill" data-act="score" title="how flagged artists have done since they were flagged">scorecard</button></div>
    <div class="kg"><button class="pill btn tm" data-act="watch" hidden title="track an artist that is not on the sheet">+ watch artist</button><button class="pill" data-act="nopl" aria-pressed="false" title="hide or show the playlists column">hide playlists</button><a class="pill" href="playlists.html" title="all superplaylists">superplaylists →</a></div>
  </div>
  <span class="sp"></span>
  <div class="meta"><button class="act" id="kb" data-act="help" title="keyboard shortcuts">keys ?</button><button class="me" id="me" data-act="me" title="your name - click to change"></button> <span id="upd"></span></div>
</header>

<div class="layout">
<aside id="aside">
  <h4>listeners <button data-act="clr-bk">clear</button></h4>
  <div class="bk" id="bk"></div><div class="bkl" id="bkl"></div>
  <h4>found on <span style="font-size:10px">label filters · ↗ opens</span></h4>
  <div class="scroll" id="f-pl" style="max-height:300px"></div>
  <h4>agency</h4>
  <div class="scroll" id="f-ag"></div>
  <h4>release</h4>
  <div class="scroll" id="f-lb"></div>
  <h4>press outlets</h4>
  <div class="scroll" id="f-pr"></div>
  <h4>superplaylists</h4>
  <div class="scroll" id="f-sp"></div>
  <button class="act" data-act="facets" style="margin-top:18px">done</button>
</aside>

<main>
  <div class="tabs" id="tabs" role="group" aria-label="views"></div>
  <div class="tabs tools">
    <button class="act" data-act="facets">filters</button>
    <input class="q" id="q" type="search" placeholder="search artist, song, outlet, playlist, agency, notes  ( / )" aria-label="search" autocomplete="off" spellcheck="false">
    <button class="act" data-act="menu" data-v="view" aria-haspopup="menu">view ▾</button>
    <button class="act" data-act="menu" data-v="sort" aria-haspopup="menu">sort ▾</button>
    <button class="act tm" data-act="menu" data-v="views" aria-haspopup="menu" hidden>saved views ▾</button>
    <button class="act" data-act="menu" data-v="share" aria-haspopup="menu">share ▾</button>
  </div>
  <div class="cntrow"><span id="cnt" role="status" aria-live="polite"></span><div class="active" id="active"></div></div>
  <div class="head" id="head">
    <button data-sort="date">date</button><button data-sort="artist">artist</button><button data-sort="song">song</button>
    <button class="r" data-sort="listeners">monthly listeners</button><button class="r" data-sort="ig">instagram</button>
    <button data-sort="press">press</button><button data-sort="ag">rostr</button><button data-sort="pls">playlists</button>
  </div>
  <div id="rows"></div>
  <div id="hist" hidden></div>
  <div id="who" hidden><div class="logo">A&amp;R Instinct</div><p>enter your name for flags / notes</p><form id="whof" autocomplete="off"><div class="row2"><input id="whoi" maxlength="24" placeholder="your name" aria-label="name"><button type="submit">enter</button><button type="button" id="whox" hidden>cancel</button></div></form></div>
  <div class="empty" id="empty" hidden>nothing matches. <button class="act" data-act="clear">clear filters</button></div>
</main>
</div>
<footer><span id="foot"></span></footer>
<div id="pop" hidden></div>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script>document.write('<script src="app.js?'+Date.now()+'"><\/script>')</script>
</body>
</html>
